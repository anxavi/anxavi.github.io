      const [dualJourney, setDualJourney] = useState(false);

      // Outfit Prescrito

      const [swipeState, setSwipeState] = useState({

      const [editedGarmentData, setEditedGarmentData] = useState(null);
      // ARACHNE_P3_HANDLERS_START
      const [garmentReadOnly, setGarmentReadOnly] = useState(false);
      const garmentDialogRef = useRef(null);

      const outfitGestureRef = useRef({startX:0,startY:0,moved:false});
      const closeGarmentDetails = () => {
        setSelectedGarmentModal(null);

        const trigger = garmentTriggerRef.current;

      const openGarmentDetails = (garment, readOnly = false, trigger = null) => {

      const handleOutfitGarmentClick = (garment, event) => {

      };
      const handleGarmentDetailKeyDown = event => {
        if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeGarmentDetails(); return; }
        if (event.key !== 'Tab') return;
        const controls = [...event.currentTarget.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex="0"]')];
        const first = controls[0], last = controls[controls.length-1];
        if (!first) { event.preventDefault(); return; }
        if (event.shiftKey && (document.activeElement === first || document.activeElement === event.currentTarget)) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      };
      useEffect(() => {
        if (selectedGarmentModal) garmentDialogRef.current?.querySelector('button')?.focus({preventScroll:true});

      // ARACHNE_P3_HANDLERS_END


      //      // Estados para "Añadir Esenciales" con botones interactivos y reinicio continuo
      const [showBasicsModal, setShowBasicsModal] = useState(false);
      const [essentialFlowStep, setEssentialFlowStep] = useState('grid'); // 'grid' | 'customize'
      const [customizingEssential, setCustomizingEssential] = useState(null);

      // Modal de Inspección y Etiquetado en "Guardados"
      const [inspectedLook, setInspectedLook] = useState(null);
      const [newTagInput, setNewTagInput] = useState("");

      // Modal / Flujo de Captura
      const [showCaptureModal, setShowCaptureModal] = useState(false);
      const [captureStage, setCaptureStage] = useState('select'); // 'select' | 'preview_edit'
      const [capturedPhotoUrl, setCapturedPhotoUrl] = useState(null);
      const [capturedGarmentData, setCapturedGarmentData] = useState({
        name: "",
        brand: "",

      });
      const fileInputRef = useRef(null);
      const cameraInputRef = useRef(null);

      // Filtro de Categoría en Armario
      const [wardrobeFilter, setWardrobeFilter] = useState('all');

      //      // =========================================================================
      // MOTOR MODULAR ASÍNCRONO (validación + búsqueda heurística + proveedor local/remoto)
      // =========================================================================
      const invalidateGeneration = () => {
        const previous = generationRequestRef.current;
        generationRequestRef.current = { id: previous.id + 1, abortController: null, waitTimer: null };
        clearTimeout(previous.waitTimer);
        previous.abortController?.abort();
      };
      const cancelGeneration = () => {
        invalidateGeneration();
        setGenerationState('idle');
        setGenerationError(null);
        setGenerationWarning(null);
        setShowRetryHint(false);
      };
      useEffect(() => () => invalidateGeneration(), []);
      useEffect(() => {
        if (generationRequestRef.current.abortController) cancelGeneration();
      }, [eventContext, dualJourney, dualJourneyType, currentView, isAuthenticated, lang, wardrobe]);

      const resetInteractionState = () => {
        setSwipeState({ offsetX: 0, isDragging: false, startX: 0, startY: 0, isHorizontal: null });
      };

      const mapEngineOutfitToUI = (engineOutfit, score, editorial, transitionLayer, intentUsed) => ({contextSnapshot: { occasion: eventContext, tempC: weather?.tempC, dualJourney: { enabled: dualJourney, type: dualJourneyType } },
        id: `outfit_${Date.now()}`,
        top: engineOutfit.top || null,
        bottom: engineOutfit.bottom || null,
        outerwear: engineOutfit.outerwear || null,
        footwear: engineOutfit.footwear || null,
        transitionLayer: transitionLayer || null,
        editorial,
        harmonyScore: score?.overall ?? 0,
        scoreMeta: score || null,
        lastIntent: intentUsed || null,
        breakdown: score?.factors || {}
      });

      const [inventoryReady, setInventoryReady] = useState(false);
      const [inventoryLoadError, setInventoryLoadError] = useState(false);
      useEffect(() => {
        let alive = true;
        Promise.resolve(window.__ARACHNE_ENGINE_READY__).then(() => {
          if (alive) setInventoryReady(Boolean(window.__ARACHNE_AVAILABILITY__ && window.__ARACHNE_INVENTORY_PANEL__));
        }).catch(() => { if (alive) setInventoryLoadError(true); });
        return () => { alive = false; };
      }, []);
      const missingCategoryGaps = inventoryReady ? window.__ARACHNE_AVAILABILITY__.categoryGaps(wardrobe) : [];
      const unavailableCurrentIds = inventoryReady ? window.__ARACHNE_AVAILABILITY__.unavailableOutfitIds(currentOutfit, wardrobe) : [];

      const generatePrescription = async (extraIntent = null) => {
        const gaps = window.__ARACHNE_AVAILABILITY__?.categoryGaps(wardrobe) || [];
        if (gaps.length) {
          cancelGeneration();
          setGenerationError(window.__ARACHNE_AVAILABILITY__.missingMessage(wardrobe, lang));
          setGenerationState('error');
          return;
        }
        setShowTweakDrawer(false);
        setGenerationError(null);
        setGenerationWarning(null);
        setShowRetryHint(false);

        invalidateGeneration();

        const requestId = generationRequestRef.current.id + 1;
        const abortController = new AbortController();
        const isCurrent = () => generationRequestRef.current.id === requestId && !abortController.signal.aborted;
        const assertCurrent = () => {
          if (!isCurrent()) throw new DOMException('Canceled', 'AbortError');
        };
        generationRequestRef.current = {
          id: requestId,
          abortController,
          waitTimer: setTimeout(() => {
            if (isCurrent()) setShowRetryHint(true);
          }, 10000)
        };

        setGenerationState('loading');
        const startedAt = Date.now();

        try {
          await (window.__ARACHNE_ENGINE_READY__ || Promise.resolve());
          assertCurrent();
          const engine = window.__ARACHNE_ENGINE__;

          if (!engine) throw new Error('Motor no disponible.');

          const response = await window.__ARACHNE_ASYNC__.abortable(engine.generate({
            wardrobe,
            context: {
              occasion: eventContext,
              tempC: weather?.tempC,
              rainProb: weather?.rainProb,
              windKph: weather?.windKph ?? null,
              lang,
              dualJourney: {
                enabled: dualJourney,
                type: dualJourney ? dualJourneyType : null
              }
            },
            intent: extraIntent || 'default',
            currentOutfit,
            history,
            signal: abortController.signal
          }), abortController.signal);

          if (!isCurrent()) return;

          if (response.provider === 'local' && (response.diagnostics?.warnings || []).some(w => w.code === 'REMOTE_FALLBACK_LOCAL')) {
            setGenerationWarning(lang === 'en'
              ? 'Remote provider failed; local engine used explicitly.'
              : lang === 'ca'
                ? 'El proveïdor remot ha fallat; s’ha utilitzat explícitament el motor local.'
                : 'El proveedor remoto falló; se usó explícitamente el motor local.');
          }

          const runtimeMin = Math.min(2500, Number(window.ARACHNE_MIN_VISUAL_MS || 1200));
          const elapsed = Date.now() - startedAt;
          if (response.result?.status === 'success' && elapsed < runtimeMin) {
            await window.__ARACHNE_ASYNC__.delay(runtimeMin - elapsed, abortController.signal);
          }

          assertCurrent();
          if (response.result?.status !== 'success') {
            setGenerationState('error');
            setGenerationError(response.result?.explanation || (lang === 'en' ? 'No valid outfit could be generated.' : lang === 'ca' ? 'No s’ha pogut generar un outfit vàlid.' : 'No se pudo generar un outfit válido.'));
            return;
          }

          const mapped = mapEngineOutfitToUI(
            response.result.outfit,
            response.result.score,
            response.result.editorial,
            response.result.transitionLayer,
            extraIntent || 'default'
          );

          if (!mapped.top || !mapped.bottom || !mapped.footwear) {
            setGenerationState('error');
            setGenerationError(lang === 'en' ? 'The engine returned an incomplete outfit.' : lang === 'ca' ? 'El motor ha retornat un outfit incomplet.' : 'El motor devolvió un outfit incompleto.');
            return;
          }

          assertCurrent();
          setCurrentOutfit(mapped);
          setGeneratedCount(prev => prev + 1);
          resetInteractionState();
          setGenerationState('success');

          const warningText = (response.diagnostics?.warnings || []).map(w => w.message).join(' · ');
          if (warningText) setGenerationWarning(warningText);
        } catch (error) {
          if (error?.name === 'AbortError') {
            if (generationRequestRef.current.id === requestId) {
              setGenerationState('idle');
              setGenerationError(lang === 'en' ? 'Generation canceled.' : lang === 'ca' ? 'Generació cancel·lada.' : 'Generación cancelada.');
            }
            return;
          }
          if (!isCurrent()) return;
          setGenerationState('error');
          setGenerationError(error?.message || (lang === 'en' ? 'Unexpected generation error.' : lang === 'ca' ? 'Error inesperat en la generació.' : 'Error inesperado en la generación.'));
        } finally {
          if (generationRequestRef.current.id === requestId) {
            if (generationRequestRef.current.waitTimer) {
              clearTimeout(generationRequestRef.current.waitTimer);
              generationRequestRef.current.waitTimer = null;
            }
            generationRequestRef.current.abortController = null;
            setShowRetryHint(false);
          }
        }
      };

      //      // -----------------------------------------------------------------------
      // GESTIÓN TÁCTIL CON PRIORIZACIÓN DE SCROLL VERTICAL (ANTI-CONFLICTO)
      // -----------------------------------------------------------------------
      const handleTouchStart = (e) => {
        const point = e.touches ? e.touches[0] : e;
        outfitGestureRef.current = {startX:point.clientX,startY:point.clientY,moved:false};
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setSwipeState({
          offsetX: 0,
          isDragging: true,
          startX: clientX,
          startY: clientY,
          isHorizontal: null
        });
      };

      const handleTouchMove = (e) => {
        const point = e.touches ? e.touches[0] : e;
        const gesture = outfitGestureRef.current;
        if (Math.hypot(point.clientX-gesture.startX, point.clientY-gesture.startY) > 8) gesture.moved = true;
        if (!swipeState.isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const diffX = clientX - swipeState.startX;
        const diffY = clientY - swipeState.startY;

        // Detección inicial del vector dominante
        if (swipeState.isHorizontal === null) {
          if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 6) {
            setSwipeState(prev => ({ ...prev, isDragging: false, isHorizontal: false }));
            return;
          } else if (Math.abs(diffX) > 6) {
            setSwipeState(prev => ({ ...prev, isHorizontal: true }));
          }
        }

        if (swipeState.isHorizontal) {
          if (e.cancelable && e.touches) e.preventDefault();
          setSwipeState(prev => ({ ...prev, offsetX: diffX }));
        }
      };

      const handleTouchEnd = () => {
        if (!swipeState.isDragging || !swipeState.isHorizontal) {
          setSwipeState({ offsetX: 0, isDragging: false, startX: 0, startY: 0, isHorizontal: null });
          return;
        }
        const threshold = 75;
        if (swipeState.offsetX > threshold) {
          setSwipeState({ offsetX: 0, isDragging: false, startX: 0, startY: 0, isHorizontal: null });
          handleSaveOutfit();
        } else if (swipeState.offsetX < -threshold) {
          setSwipeState({ offsetX: 0, isDragging: false, startX: 0, startY: 0, isHorizontal: null });
          setShowTweakDrawer(true);
        } else {
          setSwipeState({ offsetX: 0, isDragging: false, startX: 0, startY: 0, isHorizontal: null });
        }
      };

      // Sustituir prenda en el look con recalibración heurística determinista


      // Confirmar "Me lo puse hoy" con persistencia de prendas reales
      const savedActionRef = useRef(false);
      const handleSaveOutfit = () => {
        const p = window.__ARACHNE_PRESENTATION__;
        if (!p || !currentOutfit || isGenerating || savedActionRef.current) return;
        const context = { occasion: eventContext, tempC: weather?.tempC, dualJourney: { enabled: dualJourney, type: dualJourneyType } };
        const result = p.saveLook(history, currentOutfit, wardrobe, context);
        if (!result.ok) { showToast(p.copy(lang).unavailable); return; }
        savedActionRef.current = true;
        setHistory(previous => p.saveLook(previous, currentOutfit, wardrobe, context).history);
        resetInteractionState();
        showToast(p.copy(lang).savedToast);
        queueMicrotask(() => { savedActionRef.current = false; });
      };
      const handleMarkSavedWorn = (id) => {
        const p = window.__ARACHNE_PRESENTATION__;
        if (!p || savedActionRef.current) return;
        const result = p.markWorn(history, wardrobe, id);
        if (!result.ok) { showToast(p.copy(lang).unavailable); return; }
        if (result.duplicate) return;
        savedActionRef.current = true;
        setHistory(result.history);
        setWardrobe(result.wardrobe);
        if (inspectedLook?.id === id) setInspectedLook(result.history.find(look => look.id === id));
        showToast(p.copy(lang).wornToast);
        queueMicrotask(() => { savedActionRef.current = false; });
      };

      //      // Ingesta de fotos con compresión WebP
      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_DIM = 1200;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_DIM) {
                height *= MAX_DIM / width;
                width = MAX_DIM;
              }
            } else {
              if (height > MAX_DIM) {
                width *= MAX_DIM / height;
                height = MAX_DIM;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              const url = URL.createObjectURL(blob);
              setCapturedPhotoUrl(url);
              setCapturedGarmentData({
                name: "Sobrecamisa Estructurada",
                brand: "Arket",
                size: "M",
                category: "outerwear",
                fabric: "Algodón sarga denso",
                fabricKey: "dense_twill",
                formality: 6
              });
              setCaptureStage('preview_edit');
            }, 'image/webp', 0.82);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveCapturedGarment = () => {
        if (!capturedGarmentData.brand.trim()) {
          showToast(t.brandRequiredAlert);
          return;
        }

        const newGarment = {
          id: "g_" + Date.now(),
          name: capturedGarmentData.name || (lang === 'es' ? "Prenda Nueva" : "New Garment"),
          brand: capturedGarmentData.brand.trim(),
          size: capturedGarmentData.size || "M",
          category: capturedGarmentData.category,
          subCategory: "outerwear",
          color: { primaryHex: "#2C3E50", undertone: "neutral", family: "blue" },
          fabric: capturedGarmentData.fabric,
          fabricKey: capturedGarmentData.fabricKey,
          formality: Number(capturedGarmentData.formality) || 5,
          thermalRange: { minTempC: 12, maxTempC: 22 },
          state: "available",
          timesWorn: 0,
          imageUrl: capturedPhotoUrl || "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=700&q=80"

                    <input
                      type="file"
                      ref={cameraInputRef}
                      accept="image/*"
                      capture="environment"
                      className="hidden"
                      onChange={(e) => handleImageFile(e.target.files[0])}
                    />

                    <input
                      type="file"
                      ref={fileInputRef}
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => handleImageFile(e.target.files[0])}
                    />

                    <button
                      onClick={() => cameraInputRef.current?.click()}
                      className="w-full p-3.5 rounded-xl border border-arachne-border hover:border-arachne-terracotta bg-arachne-surface/40 hover:bg-white text-left transition-all flex items-center space-x-3 group"
                    >
                      <div className="w-10 h-10 rounded-full bg-arachne-terracottaLight text-arachne-terracotta flex items-center justify-center">
                        <Icon name="cameraCenter" className="w-5 h-5" />
                      </div>
                      <div>
                        <h4 className="text-xs font-bold text-arachne-ink group-hover:text-arachne-terracotta">{t.takePhotoOption}</h4>
                        <span className="text-[10px] text-arachne-inkMuted">{t.takePhotoSub}</span>
                      </div>
                    </button>

                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full p-3.5 rounded-xl border border-arachne-border hover:border-arachne-terracotta bg-arachne-surface/40 hover:bg-white text-left transition-all flex items-center space-x-3 group"
                    >
                      <div className="w-10 h-10 rounded-full bg-arachne-sageLight text-arachne-sage flex items-center justify-center">
                        <Icon name="upload" className="w-5 h-5" />
                      </div>
                      <div>
                        <h4 className="text-xs font-bold text-arachne-ink group-hover:text-arachne-terracotta">{t.uploadPhotoOption}</h4>
                        <span className="text-[10px] text-arachne-inkMuted">{t.uploadPhotoSub}</span>
                      </div>
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="h-44 rounded-xl overflow-hidden bg-arachne-surface border border-arachne-border relative">
                      <img src={capturedPhotoUrl} alt="Captured" className="w-full h-full object-cover" />
                      <div className="absolute bottom-2 left-2 bg-black/65 backdrop-blur-xs text-white text-[10px] px-2.5 py-0.5 rounded-full font-medium">
                        ✓ WebP 1200px · 180 KB
                      </div>
                    </div>

                    <div className="space-y-2">
                      <div>
                        <label className="text-[10px] font-bold uppercase text-arachne-inkMuted block">{t.brandLabel} *</label>
                        <input
                          type="text"
                          value={capturedGarmentData.brand}
                          onChange={(e) => setCapturedGarmentData({ ...capturedGarmentData, brand: e.target.value })}
                          placeholder="Arket, Zara, COS, Vintage..."
                          className="w-full text-xs p-2 rounded-lg border border-arachne-border outline-none font-semibold focus:border-arachne-ink"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[10px] font-bold uppercase text-arachne-inkMuted block">{t.garmentNameLabel}</label>
                          <input
                            type="text"
                            value={capturedGarmentData.name}
                            onChange={(e) => setCapturedGarmentData({ ...capturedGarmentData, name: e.target.value })}
                            className="w-full text-xs p-2 rounded-lg border border-arachne-border outline-none focus:border-arachne-ink"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] font-bold uppercase text-arachne-inkMuted block">{t.sizeLabel}</label>
                          <input
                            type="text"
                            value={capturedGarmentData.size}
                            onChange={(e) => setCapturedGarmentData({ ...capturedGarmentData, size: e.target.value })}
                            placeholder="M, 40, Única..."
                            className="w-full text-xs p-2 rounded-lg border border-arachne-border outline-none focus:border-arachne-ink"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="text-[10px] font-bold uppercase text-arachne-inkMuted block">{t.categoryLabel}</label>
                        <select
                          value={capturedGarmentData.category}
                          onChange={(e) => setCapturedGarmentData({ ...capturedGarmentData, category: e.target.value })}
                          className="w-full text-xs p-2 rounded-lg border border-arachne-border outline-none bg-white focus:border-arachne-ink"
                        >
                          <option value="top">{t.optTop}</option>
                          <option value="bottom">{t.optBottom}</option>
                          <option value="outerwear">{t.optOuter}</option>
                          <option value="footwear">{t.optFootwear}</option>
                          <option value="accessory">{t.optAccessory}</option>
                        </select>
                      </div>
                    </div>

                    <div className="pt-2 flex space-x-2">
                      <button
                        onClick={() => { setCapturedPhotoUrl(null); setCaptureStage('select'); }}
                        className="flex-1 py-2 text-xs font-semibold rounded-lg border border-arachne-border text-arachne-ink hover:bg-arachne-surface"
                      >
                        {t.retakePhotoBtn}
                      </button>
                      <button
                        onClick={handleSaveCapturedGarment}
                        className="flex-1 py-2 text-xs font-semibold rounded-lg bg-arachne-ink text-white"
                      >
                        {t.saveToWardrobeBtn}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* */}
          {/* BARRA DE NAVEGACIÓN INFERIOR ELEVADA */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-arachne-border z-40 px-4 py-2 flex items-center justify-between">

            {/* HOY (#svg-inicio-b) */}
            <button
              onClick={() => setCurrentView('today')}
              className={`flex flex-col items-center flex-1 transition-colors ${
                currentView === 'today' ? 'text-arachne-ink font-bold' : 'text-arachne-inkMuted hover:text-arachne-ink'
              }`}
            >
              <Icon name="homeToday" className="w-5 h-5" />
              <span className="text-[10px] mt-1 tracking-tight">{t.navToday}</span>
            </button>

            {/* ARMARIO */}
            <button
              onClick={() => setCurrentView('wardrobe')}
              className={`flex flex-col items-center flex-1 transition-colors ${
                currentView === 'wardrobe' ? 'text-arachne-ink font-bold' : 'text-arachne-inkMuted hover:text-arachne-ink'
              }`}
            >
              <Icon name="hanger" className="w-5 h-5" />
              <span className="text-[10px] mt-1 tracking-tight">{t.navWardrobe}</span>
            </button>

            {/* BOTÓN CENTRAL DESTACADO: CAPTURA RÁPIDA (CÁMARA TELEMÉTRICA) */}
            <div className="flex-1 flex justify-center -mt-6">
              <button
                onClick={() => {
                  setCaptureStage('select');
                  setShowCaptureModal(true);
                }}
                className="w-14 h-14 rounded-full bg-gradient-to-tr from-arachne-terracotta to-amber-600 text-white flex flex-col items-center justify-center shadow-prominent active:scale-95 transition-all ring-4 ring-arachne-terracotta/25 hover:ring-arachne-terracotta/40"
                title={t.navCapture}
              >
                <Icon name="cameraCenter" className="w-6 h-6 stroke-white" />
                <span className="text-[8px] font-bold tracking-tight uppercase mt-0.5">Captura</span>
              </button>
            </div>

            {/* GUARDADOS (#svg-guardado-a) */}
            <button
              onClick={() => setCurrentView('history')}
              className={`flex flex-col items-center flex-1 transition-colors ${
                currentView === 'history' ? 'text-arachne-ink font-bold' : 'text-arachne-inkMuted hover:text-arachne-ink'
              }`}
            >
              <Icon name="bookmarkGuardados" className="w-5 h-5" />
              <span className="text-[10px] mt-1 tracking-tight">{t.navSaved}</span>
            </button>

            {/* PERFIL */}
            <button
              onClick={() => setCurrentView('profile')}
              className={`flex flex-col items-center flex-1 transition-colors ${
                currentView === 'profile' ? 'text-arachne-ink font-bold' : 'text-arachne-inkMuted hover:text-arachne-ink'
              }`}
            >
              <Icon name="user" className="w-5 h-5" />
              <span className="text-[10px] mt-1 tracking-tight">{t.navProfile}</span>
            </button>

          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ArachneApp />);
  </script>
</body>
</html>
