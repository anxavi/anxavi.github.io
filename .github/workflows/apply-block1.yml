name: Apply and test ARACHNE block 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-block1.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: arachne-block1
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify branch publishing configuration
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '(.source.branch == "main") and (.source.path == "/") and (.build_type == "legacy")')" = true
      - name: Apply version-checked preview patch
        run: python3 tools/apply-block1.py
      - name: Run block 1 tests
        run: |
          node --check src/engine/provider.js
          node --check src/engine/browser.js
          node --check src/engine/async-control.js
          node --test test/block1.test.mjs
          git diff --check
          test "$(git hash-object index.html)" = 2142d0bd6d20e2d50d4864eaf2d33560bb00cec9
      - name: Commit preview fixes only
        run: |
          set -euo pipefail
          git add -- index-preview.html src/engine/provider.js src/engine/browser.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix block 1 preview cancellation and disable generation controls'
          git push origin HEAD:main
      - name: Request Pages build
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo 'Block 1 tests passed; preview patch committed; Pages build requested. Browser review still required.' >> "$GITHUB_STEP_SUMMARY"
