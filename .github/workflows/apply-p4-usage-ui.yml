name: Apply P4 usage UI

on:
  push:
    paths:
      - '.github/workflows/apply-p4-usage-ui.yml'
      - '.github/patches/p4-usage-ui.patch.z64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard base commit
        run: |
          parent=$(git rev-parse HEAD^)
          if [ "$parent" != "6e4670d7e8ae5fc4ebed8574f5bd3e80ca2a767b" ]; then
            echo "Unexpected base commit: $parent"
            exit 1
          fi

      - name: Verify protected base blobs
        run: |
          test "$(git rev-parse HEAD:src/engine/presentation.js)" = "08524a6a163d725cc4f22c8bdb8b44cf2f5e2ab2"
          test "$(git rev-parse HEAD:index-preview.html)" = "a176a363a7f7f45e54a14818ef504590bc30bbc1"
          if git cat-file -e HEAD:test/p4-usage-ui.test.mjs 2>/dev/null; then
            echo "Unexpected existing P4 UI test file"
            exit 1
          fi

      - name: Apply validated base patch
        run: |
          git show aff0e3f56d1eecb91140649af1f50e7c0cb338a8:.github/patches/p4-usage-ui.patch.z64 > /tmp/p4-usage-ui.patch.z64
          python3 -c "import zlib,base64;open('/tmp/p4-usage-ui.patch','wb').write(zlib.decompress(base64.b64decode(open('/tmp/p4-usage-ui.patch.z64','rb').read())))"
          git apply --check /tmp/p4-usage-ui.patch
          git apply /tmp/p4-usage-ui.patch

      - name: Fix UI test ledger initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/p4-usage-ui.test.mjs')
          text = path.read_text()
          anchor = "} from '../src/engine/presentation.js';"
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + "\nimport { createUsageLedger } from '../src/engine/usage.js';", 1)
          old = "const ledger = createUsageSession(2);"
          assert text.count(old) == 1
          text = text.replace(old, "const ledger = createUsageLedger(2);", 1)
          path.write_text(text)
          PY

      - name: Run P4 tests
        run: |
          node --test test/p4-usage.test.mjs
          node --test test/p4-usage-ui.test.mjs

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/presentation.js index-preview.html test/p4-usage-ui.test.mjs
          git rm .github/patches/p4-usage-ui.patch.z64
          git commit -m "Connect partial daily usage controls to reversible ledger [skip ci]"
          git push
