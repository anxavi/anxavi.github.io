name: Apply guarded P3 garment details
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-p3-garment-details.yml']
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: arachne-apply-p3-garment-details
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'anxavi/anxavi.github.io' && github.event.head_commit.message == 'Prepare guarded P3 garment detail application'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact approved base
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 92446541905ea3d4530a6d7911083bba34d2421e
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/apply-p3-garment-details.yml
      - name: Apply only the approved P3 patch and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          original = Path('index-preview.html').read_bytes()
          assert blob(original) == '266e896e5e836521ad6c04b8710878ba81e35e55', 'Preview changed: stop and review'
          assert blob(Path('index.html').read_bytes()) == '2142d0bd6d20e2d50d4864eaf2d33560bb00cec9', 'Original page integrity mismatch'
          assert not Path('test/p3-garment-details.test.mjs').exists(), 'P3 test already exists'
          encoded = ''
          payload = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == '2d046a402fcb7d94c1fd0b02c46e700ccc4d77e0f09d772cdd2aa36fa23c6450', 'Patch payload mismatch'
          data = json.loads(payload)
          text = original.decode('utf-8')
          for old,new in data['patches']:
              assert text.count(old) == 1, 'Missing or ambiguous anchor: '+old[:100]
              text = text.replace(old,new,1)
          updated = text.encode('utf-8')
          assert blob(updated) == 'a176a363a7f7f45e54a14818ef504590bc30bbc1', 'Unexpected P3 result'
          Path('index-preview.html').write_bytes(updated)
          Path('test/p3-garment-details.test.mjs').write_text(data['tests'],encoding='utf-8')
          PY
      - name: Verify protected page, scope, syntax and all tests
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = 2142d0bd6d20e2d50d4864eaf2d33560bb00cec9
          test "$(git diff --name-only)" = index-preview.html
          test "$(git ls-files --others --exclude-standard)" = test/p3-garment-details.test.mjs
          for file in src/engine/*.js src/ui/*.js; do
            node --input-type=module --check < "$file"
          done
          node --test --test-reporter=tap test/*.test.mjs
      - name: Commit only the approved P3 files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index-preview.html test/p3-garment-details.test.mjs
          git commit -m 'Open outfit garment details in read-only mode while preserving wardrobe editing'
          git push origin HEAD:main
      - name: Request existing verification workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({owner:'anxavi',repo:'anxavi.github.io',workflow_id:'ci.yml',ref:'main'});
      - name: Request publication on existing Pages site
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds',{owner:'anxavi',repo:'anxavi.github.io'});
